<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sổ tay Claude Code</title>
  <meta name="description" content="Mẹo dùng Claude Code bằng tiếng Việt, chia theo chủ đề: mỗi mẹo có lý do, cách làm và lời nhắn mẫu để chép dùng ngay.">
  <meta name="theme-color" content="#f3f5f0" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0c0c" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2317211c'/%3E%3Cpath d='M10 10.5 15.5 16 10 21.5' fill='none' stroke='%23f3f5f0' stroke-width='2.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='17.5' y='19' width='7.5' height='3.2' rx='1.4' fill='%23e2f05a'/%3E%3C/svg%3E">

  <!-- Đặt giao diện sáng/tối trước khi vẽ trang để không bị nháy -->
  <script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#danh-sach">Tới danh sách mẹo</a>

  <header class="topbar wrap">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect class="bm-bg" width="32" height="32" rx="9"/>
        <path class="bm-caret" d="M10 10.5 15.5 16 10 21.5"/>
        <rect class="bm-cursor" x="17.5" y="19" width="7.5" height="3.2" rx="1.4"/>
      </svg>
      <span data-site="name">Sổ tay Claude Code</span>
    </a>
    <div class="topbar-actions">
      <a class="topbar-link" id="docs-link" href="https://code.claude.com/docs/en/overview" target="_blank" rel="noopener">Tài liệu chính thức</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Đổi giao diện sáng hoặc tối">
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <h1 class="hero-title intro" style="--i: 0" data-site="headline">Mẹo Claude Code dùng được ngay</h1>
        <p class="hero-intro intro" style="--i: 1" data-site="intro"></p>

        <form class="ask intro" style="--i: 2" role="search" action="#" autocomplete="off">
          <label class="sr-only" for="q">Tìm mẹo</label>
          <span class="ask-caret" aria-hidden="true">&gt;</span>
          <input id="q" type="search" name="q" spellcheck="false" enterkeyhint="search" placeholder="Tìm mẹo">
          <button class="ask-clear" type="button" aria-label="Xoá từ khoá" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
          <kbd class="ask-hint" aria-hidden="true">/</kbd>
        </form>

        <p class="hero-meta intro" style="--i: 3" id="hero-meta"></p>
      </div>
    </section>

    <div class="wrap shelf" id="danh-sach">
      <aside class="side">
        <h2 class="side-title">Chủ đề</h2>
        <nav class="topics" id="topics" aria-label="Lọc theo chủ đề"></nav>
      </aside>

      <section class="results" aria-label="Danh sách mẹo">
        <div class="results-bar">
          <p class="status" id="status" aria-live="polite"></p>
          <div class="levels" id="levels" role="group" aria-label="Lọc theo mức độ">
            <button type="button" data-level="all" aria-pressed="true">Tất cả</button>
            <button type="button" data-level="co-ban" aria-pressed="false">Cơ bản</button>
            <button type="button" data-level="nang-cao" aria-pressed="false">Nâng cao</button>
          </div>
        </div>
        <div id="list"></div>
        <noscript><p class="empty">Trang này cần JavaScript để hiển thị danh sách mẹo.</p></noscript>
      </section>
    </div>
  </main>

  <footer class="footer wrap" id="footer"></footer>

  <dialog class="reader" id="reader" aria-labelledby="reader-title">
    <div class="scrim" data-action="close" aria-hidden="true"></div>
    <div class="sheet" tabindex="-1">
      <div class="sheet-bar">
        <button class="icon-btn" type="button" data-action="close" aria-label="Đóng">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
        <button class="ghost-btn" type="button" data-action="copy-link">Chép liên kết</button>
      </div>
      <article class="sheet-body" id="reader-body"></article>
    </div>
  </dialog>

  <script src="data/tips.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
